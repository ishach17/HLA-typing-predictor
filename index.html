<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HLA Typing Predictor - NGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-main">
      <header class="app-topbar" id="app-topbar">
        <div class="topbar-brand-group" id="topbar-brand-group">
          <span class="topbar-logo" id="topbar-logo"></span>
          <span class="topbar-brand-text">HLA Typing Predictor - NGS</span>
        </div>
        <div class="topbar-breadcrumb">
          <span class="topbar-instrument" id="topbar-instrument" hidden>Instrument</span>
          <span class="topbar-sep" id="topbar-sep" hidden>/</span>
          <span class="topbar-page-title" id="topbar-page-title">Analysis Selection</span>
        </div>
        <button type="button" class="topbar-overview-btn" id="topbar-overview-btn" hidden>
          <span aria-hidden="true">&larr;</span> Overview
        </button>
      </header>

      <main class="app-content">
        <div class="app-view" id="view-home">
          <h2 class="content-hero-title">Analysis Selection</h2>
          <div class="section-grid" id="section-grid"></div>
        </div>

        <div class="app-view" id="view-single" hidden>
          <button type="button" class="back-link" id="back-to-sections-single">
            <span aria-hidden="true">&larr;</span> Back to Sections
          </button>
          <h2 class="content-hero-title">Single Analysis</h2>
          <p class="content-hero-subheading">Report pipeline &middot; 3 stages &middot; start at any stage</p>
          <div class="section-grid" id="single-subsection-grid"></div>
        </div>

        <div class="app-view" id="view-rpl" hidden>
          <button type="button" class="back-link" id="back-to-sections-rpl">
            <span aria-hidden="true">&larr;</span> Back to Sections
          </button>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <button type="button" class="breadcrumb-step" id="breadcrumb-single-rpl">Single</button>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <span class="breadcrumb-current">RPL</span>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <button type="button" class="breadcrumb-step" id="breadcrumb-upload-files-rpl">Upload Files</button>
          </nav>

          <div class="single-page-grid">
            <div id="rpl-input-container"></div>
            <div id="rpl-results-container"></div>
          </div>
        </div>

        <div class="app-view" id="view-control" hidden>
          <button type="button" class="back-link" id="back-to-sections-control">
            <span aria-hidden="true">&larr;</span> Back to Sections
          </button>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <button type="button" class="breadcrumb-step" id="breadcrumb-single-control">Single</button>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <span class="breadcrumb-current">Non RPL Control</span>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <button type="button" class="breadcrumb-step" id="breadcrumb-upload-files-control">Upload Files</button>
          </nav>

          <div class="single-page-grid">
            <div id="control-input-container"></div>
            <div id="control-results-container"></div>
          </div>
        </div>

        <div class="app-view" id="view-analytics" hidden>
          <button type="button" class="back-link" id="back-to-sections-analytics">
            <span aria-hidden="true">&larr;</span> Back to Sections
          </button>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <button type="button" class="breadcrumb-step" id="breadcrumb-single-analytics">Single</button>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <span class="breadcrumb-current">Analytics</span>
          </nav>

          <div class="analytics-upload-row">
            <div id="analytics-rpl-input-container"></div>
            <div id="analytics-control-input-container"></div>
          </div>

          <div class="analytics-actions-row">
            <button type="button" class="view-analytics-btn" id="view-analytics-btn" disabled>View Analytics</button>
          </div>

          <div class="analytics-chart-container" id="analytics-chart-container" hidden></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="rplReferenceData.js"></script>
  <script src="app.js"></script>
</body>
</html>
