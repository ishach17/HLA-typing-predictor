<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HLA Typing Predictor - NGS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo" id="sidebar-logo"></div>
        <h1 class="sidebar-title">HLA Typing Predictor</h1>
        <p class="sidebar-subtitle">Exploring HLA allele patterns and their studied associations</p>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Analysis sections"></nav>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <span class="topbar-page-title" id="topbar-page-title">Analysis Selection</span>
      </header>

      <main class="app-content">
        <div class="app-view" id="view-home">
          <h2 class="content-hero-title">Analysis Selection</h2>
          <div class="section-grid" id="section-grid"></div>
        </div>

        <div class="app-view" id="view-single" hidden>
          <button type="button" class="back-link" id="back-to-sections">
            <span aria-hidden="true">&larr;</span> Back to Sections
          </button>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <button type="button" class="breadcrumb-step" id="breadcrumb-rpl-predictor">RPL Predictor</button>
            <span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span>
            <button type="button" class="breadcrumb-step" id="breadcrumb-upload-files">Upload Files</button>
          </nav>

          <div class="single-page-grid">
            <div id="single-input-container"></div>
            <div id="single-results-container"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="rplReferenceData.js"></script>
  <script src="app.js"></script>
</body>
</html>
